services:
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command:
      - sh
      - -c
      - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fin_events}:${POSTGRES_PASSWORD:-fin_events}@database:5432/${POSTGRES_DB:-fin_events}?serverVersion=18&charset=utf8"
    volumes:
      - ./:/app
      - /app/vendor
    depends_on:
      database:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fin_events}:${POSTGRES_PASSWORD:-fin_events}@database:5432/${POSTGRES_DB:-fin_events}?serverVersion=18&charset=utf8"
    volumes:
      - ./:/app
      - /app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fin_events}:${POSTGRES_PASSWORD:-fin_events}@database:5432/${POSTGRES_DB:-fin_events}?serverVersion=18&charset=utf8"
    volumes:
      - ./:/app
      - /app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fin_events}
      POSTGRES_USER: ${POSTGRES_USER:-fin_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fin_events}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-fin_events}", "-U", "${POSTGRES_USER:-fin_events}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - database_data:/var/lib/postgresql:rw
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  database_data:
